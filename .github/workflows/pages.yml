name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `refrain verify` runs from packages/pipeline/dist, which npm ci does not
      # produce. CI only gets away with skipping this because its typecheck step
      # emits the same output on the way past; the gate below needs it outright.
      - name: Build the pipeline
        run: npm run build --workspace @refrain/pipeline

      # Nothing is deployed that has not been verified: a catalogue that does
      # not match its own hash, or a missing audio file, fails here.
      - name: Verify the published library
        run: npm run pipeline -- verify

      - name: Build
        run: npm run build:listener
        env:
          # GitHub Pages serves a project site from /<repo>/.
          REFRAIN_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/listener/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
