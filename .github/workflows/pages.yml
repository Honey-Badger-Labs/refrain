name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `refrain verify` runs from packages/pipeline/dist, which npm ci does not
      # produce. CI only gets away with skipping this because its typecheck step
      # emits the same output on the way past; the gate below needs it outright.
      - name: Build the pipeline
        run: npm run build --workspace @refrain/pipeline

      # Nothing is deployed that has not been verified: a catalogue that does
      # not match its own hash, or a missing audio file, fails here.
      - name: Verify the published library
        run: npm run pipeline -- verify

      - name: Build
        run: npm run build:listener
        env:
          # GitHub Pages serves a project site from /<repo>/.
          REFRAIN_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/listener/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
